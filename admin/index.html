<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Διαχείριση — Παράδοση στην Ελλάδα</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body { background: #f8f9fa; }
    .sidebar { width: 240px; min-height: 100vh; background: #1a1a2e; }
    .sidebar .nav-link { color: rgba(255,255,255,0.7); border-radius: 8px; margin: 2px 8px; padding: 10px 14px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.1); color: #fff; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1rem; padding: 20px 16px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; }
    .main-content { flex: 1; overflow-y: auto; }
    .card { border-radius: 12px; border: none; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
    .stat-card { text-align: center; padding: 24px; }
    .stat-number { font-size: 2.5rem; font-weight: 700; }
    .badge-festival  { background-color: #f59e0b; }
    .badge-museum    { background-color: #3b82f6; }
    .badge-church    { background-color: #8b5cf6; }
    .badge-music     { background-color: #10b981; }
    .badge-dance     { background-color: #ef4444; }
    .badge-food      { background-color: #f97316; }
    .badge-custom    { background-color: #6b7280; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/admin/src/main.jsx"></script>
</body>
</html>
